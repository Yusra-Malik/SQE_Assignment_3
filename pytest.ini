[pytest]
addopts = -v -n auto
markers =
    word_tests: Unit tests for Word module
    wordlist_tests: Unit tests for WordList collection
    sentiment_tests: Unit tests for PatternAnalyzer sentiment model
    blob_tests: Unit tests for TextBlob core module (Module 4)
    sentence_tests: Unit tests for Sentence module (Module 5)
    parser_tests: Unit tests for PatternParser module (Module 6)
    csv_tests: Data-driven CSV and Excel execution suite